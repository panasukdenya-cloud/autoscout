<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoScout</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: white;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
    }

    .card {
      background: #191c22;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111318;
      color: white;
      margin-bottom: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #ff3b30;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    .result {
      background: #191c22;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 14px;
    }

    .result img {
      width: 100%;
      display: block;
    }

    .info {
      padding: 14px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .price {
      font-size: 22px;
      font-weight: 700;
    }

    .discount {
      display: inline-block;
      margin-top: 8px;
      background: #2a1d1d;
      color: #ff6b61;
      padding: 6px 10px;
      border-radius: 10px;
      font-weight: 700;
    }

    .meta {
      margin-top: 8px;
      color: #bbb;
      font-size: 14px;
      line-height: 1.5;
    }

    .open {
      display: block;
      text-align: center;
      margin-top: 12px;
      padding: 12px;
      background: #2c2f36;
      border-radius: 10px;
      color: white;
      text-decoration: none;
    }

    #status {
      margin-top: 14px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔥 Авто нижче ринку</h1>

    <div class="card">
      <label>Марка ID — можна залишити порожнім</label>
      <input id="mark" placeholder="Наприклад 9 = BMW" />

      <label>Модель ID — можна залишити порожнім</label>
      <input id="model" placeholder="ID моделі" />

      <label>Рік від</label>
      <input id="yearFrom" type="number" value="2018" />

      <label>Рік до</label>
      <input id="yearTo" type="number" value="2021" />

      <label>Мінімально нижче ринку, %</label>
      <input id="below" type="number" value="15" />

      <button onclick="findDeals()">🔥 Знайти вигідні авто</button>
    </div>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const API = "https://autoscout-4ojj.onrender.com";

    async function findDeals() {
      const mark = document.getElementById("mark").value.trim();
      const model = document.getElementById("model").value.trim();
      const yearFrom = document.getElementById("yearFrom").value;
      const yearTo = document.getElementById("yearTo").value;
      const below = document.getElementById("below").value;

      const params = new URLSearchParams();

      if (mark) params.append("mark", mark);
      if (model) params.append("model", model);

      params.append("year_from", yearFrom);
      params.append("year_to", yearTo);
      params.append("below", below);
      params.append("limit", "20");

      document.getElementById("status").innerText = "Шукаю...";
      document.getElementById("results").innerHTML = "";

      try {
        const response = await fetch(
          `${API}/api/deals?${params.toString()}`
        );

        const data = await response.json();

        if (data.status !== "ok") {
          document.getElementById("status").innerText =
            "Помилка: " + (data.message || "невідома");
          return;
        }

        document.getElementById("status").innerText =
          `Перевірено: ${data.checked} | Знайдено: ${data.deals_found}`;

        if (!data.deals || data.deals.length === 0) {
          document.getElementById("results").innerHTML =
            "<div class='card'>Нічого нижче заданого % не знайдено.</div>";
          return;
        }

        data.deals.forEach(car => {
          const el = document.createElement("div");
          el.className = "result";

          el.innerHTML = `
            ${car.photo ? `<img src="${car.photo}" alt="">` : ""}

            <div class="info">
              <div class="title">${car.title || "Авто"}</div>

              <div class="price">
                $${Number(car.price_usd).toLocaleString()}
              </div>

              <div class="discount">
                🔥 −${car.below_market_percent}% нижче ринку
              </div>

              <div class="meta">
                Ринок: $${Number(car.market_price).toLocaleString()}<br>
                Рік: ${car.year || "-"}<br>
                Пробіг: ${car.race || "-"}<br>
                Місто: ${car.city || "-"}
              </div>

              ${car.link
                ? `<a class="open" href="${car.link}" target="_blank">
                    Відкрити на AUTO.RIA
                  </a>`
                : ""
              }
            </div>
          `;

          document.getElementById("results").appendChild(el);
        });

      } catch (e) {
        document.getElementById("status").innerText =
          "Помилка з'єднання з сервером";
      }
    }
  </script>
</body>
</html>
