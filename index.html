<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoScout</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: white;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 18px;
    }

    .card {
      background: #191c22;
      border-radius: 16px;
      padding: 14px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin: 8px 0 6px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111318;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #ff3b30;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    #status {
      margin-top: 14px;
      text-align: center;
      color: #aaa;
    }

    .result {
      background: #191c22;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 14px;
    }

    .result img {
      width: 100%;
      display: block;
    }

    .info {
      padding: 14px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .price {
      font-size: 22px;
      font-weight: 700;
      margin-top: 6px;
    }

    .discount {
      margin-top: 8px;
      display: inline-block;
      padding: 6px 10px;
      border-radius: 10px;
      background: #2a1d1d;
      color: #ff6b61;
      font-weight: 700;
    }

    .meta {
      margin-top: 10px;
      color: #bbb;
      line-height: 1.5;
    }

    .open {
      display: block;
      margin-top: 12px;
      padding: 12px;
      text-align: center;
      background: #2c2f36;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>
<div class="wrap">

  <h1>🔥 Авто нижче ринку</h1>

  <div class="card">

    <label>Марка ID — необов'язково</label>
    <input id="mark" placeholder="Наприклад BMW = 9">

    <label>Модель ID — необов'язково</label>
    <input id="model" placeholder="Можна залишити порожнім">

    <label>Область</label>
    <select id="region">
      <option value="">🇺🇦 Вся Україна</option>
      <option value="1">Вінницька</option>
      <option value="18">Волинська</option>
      <option value="11">Дніпропетровська</option>
      <option value="13">Донецька</option>
      <option value="2">Житомирська</option>
      <option value="22">Закарпатська</option>
      <option value="14">Запорізька</option>
      <option value="15">Івано-Франківська</option>
      <option value="10">Київська</option>
      <option value="16">Кіровоградська</option>
      <option value="17">Луганська</option>
      <option value="5">Львівська</option>
      <option value="19">Миколаївська</option>
      <option value="12">Одеська</option>
      <option value="20">Полтавська</option>
      <option value="9">Рівненська</option>
      <option value="8">Сумська</option>
      <option value="3">Тернопільська</option>
      <option value="7">Харківська</option>
      <option value="23">Херсонська</option>
      <option value="4">Хмельницька</option>
      <option value="24">Черкаська</option>
      <option value="6">Чернігівська</option>
      <option value="25">Чернівецька</option>
    </select>

    <label>Рік від</label>
    <input id="yearFrom" type="number" value="1990" min="1900" max="2026">

    <label>Рік до</label>
    <input id="yearTo" type="number" value="2026" min="1900" max="2026">

    <label>Мінімально нижче ринку, %</label>
    <input id="below" type="number" value="18" min="1" max="90">

    <button onclick="findDeals()">
      🔥 Знайти вигідні авто
    </button>

  </div>

  <div id="status"></div>
  <div id="results"></div>

</div>

<script>

const API = "https://autoscout-4ojj.onrender.com";

async function findDeals() {

  const mark = document.getElementById("mark").value.trim();
  const model = document.getElementById("model").value.trim();
  const region = document.getElementById("region").value;

  const yearFrom = document.getElementById("yearFrom").value;
  const yearTo = document.getElementById("yearTo").value;
  const below = document.getElementById("below").value;

  const params = new URLSearchParams();

  if (mark) params.append("mark", mark);
  if (model) params.append("model", model);
  if (region) params.append("region", region);

  params.append("year_from", yearFrom);
  params.append("year_to", yearTo);
  params.append("below", below);
  params.append("limit", "20");

  document.getElementById("status").innerText =
    "🔎 Шукаю вигідні авто...";

  document.getElementById("results").innerHTML = "";

  try {

    const response = await fetch(
      `${API}/api/deals?${params.toString()}`
    );

    const data = await response.json();

    if (data.status !== "ok") {
      document.getElementById("status").innerText =
        "Помилка: " + (data.message ||
