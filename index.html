<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoScout</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    padding: 20px;
}

h1 {
    text-align: center;
}

select, input, button {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    background: #2481cc;
    color: white;
    font-weight: bold;
    margin-top: 15px;
}
</style>
</head>

<body>

<h1>🚗 AutoScout</h1>

<select>
    <option>Оберіть марку</option>
    <option>BMW</option>
    <option>Audi</option>
    <option>Mercedes-Benz</option>
    <option>Volkswagen</option>
    <option>Tesla</option>
</select>

<input type="text" placeholder="Модель">

<input type="number" placeholder="Рік від">

<input type="number" placeholder="Рік до">

<input type="number" placeholder="Ціна від, $">

<input type="number" placeholder="Ціна до, $">

<button>🔎 Знайти автомобілі</button>

</body>
</html>
